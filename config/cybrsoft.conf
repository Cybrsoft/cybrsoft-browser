# Cybrsoft Browser — fork configuration (single source of truth)
# POSIX-sh sourceable. Every build/rebase script reads these values.
# Change the upstream pin ONLY via build/scripts/rebase.sh so patches are
# re-validated against the new source.

# --- Product identity ---
CB_PRODUCT_NAME="Cybrsoft Browser"
CB_VENDOR="Cybrsoft"
CB_APP_ID="browser@cybrsoft"          # internal id; final value set during branding
CB_UPDATE_CHANNEL="release"           # our release channel name (not Mozilla's)

# --- Upstream pin (Firefox ESR) ---
# Current ESR line as of 2026-11: 153.x  (ESR 140 reached EOL 2026-09-29).
# Verify the exact point release at https://www.mozilla.org/firefox/enterprise/
CB_UPSTREAM_CHANNEL="esr"
CB_FIREFOX_VERSION="153.7.0"          # e.g. 153.7.0  -> firefox-153.7.0esr.source.tar.xz
CB_FIREFOX_TAG="FIREFOX_153_7_0esr_RELEASE"   # git tag on the mozilla-firefox mirror

# --- Sources ---
# Official signed source tarball (reproducible; preferred over a full VCS clone).
CB_SOURCE_BASEURL="https://archive.mozilla.org/pub/firefox/releases"
# Git mirror (used only if you need full history for bisect/blame).
CB_SOURCE_GITMIRROR="https://github.com/mozilla-firefox/firefox"

# --- Paths (relative to repo root) ---
CB_ENGINE_DIR="engine"                # extracted Firefox source (GIT-IGNORED, never committed)
CB_PATCHES_DIR="patches"              # our source patch queue
CB_PATCHES_SERIES="patches/series"    # ordered list of patches to apply
CB_PREFS_DIR="prefs"                  # default pref overlays copied into the build
CB_AUTOCONFIG_DIR="autoconfig"        # locked prefs (telemetry kill-list)
CB_BRANDING_DIR="branding/cybrsoft"   # Cybrsoft branding fed to mach
CB_MOZCONFIG="build/mozconfig.windows"

# --- Derived (do not edit) ---
CB_SOURCE_TARBALL="firefox-${CB_FIREFOX_VERSION}${CB_UPSTREAM_CHANNEL}.source.tar.xz"
CB_SOURCE_URL="${CB_SOURCE_BASEURL}/${CB_FIREFOX_VERSION}${CB_UPSTREAM_CHANNEL}/source/${CB_SOURCE_TARBALL}"
