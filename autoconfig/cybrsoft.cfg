// Cybrsoft Browser — autoconfig (LOCKED prefs)
// First line MUST be a comment; Firefox ignores it.
//
// lockPref() values here CANNOT be changed by the user, by a website, or by a
// profile import. This is the hard floor under the privacy promise: even if a
// default pref were flipped, these stay enforced. Ships next to the binary and
// is referenced by autoconfig/local-settings.js.
//
// Keep this list SHORT — only things that must never be re-enabled. Everything
// user-tunable belongs in prefs/cybrsoft.js instead.

// Data reporting can never be turned back on.
lockPref("datareporting.healthreport.uploadEnabled", false);
lockPref("datareporting.policy.dataSubmissionEnabled", false);
lockPref("toolkit.telemetry.enabled", false);
lockPref("toolkit.telemetry.unified", false);
lockPref("app.shield.optoutstudies.enabled", false);
lockPref("app.normandy.enabled", false);

// No experiment system.
lockPref("messaging-system.rsexperimentloader.enabled", false);

// Update URL is pinned to Cybrsoft's signed-MAR endpoint (set at branding time,
// placeholder shown). Never Mozilla's, never an unverified source.
// lockPref("app.update.url", "https://updates.cybrsoft.example/browser/...");
