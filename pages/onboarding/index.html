<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Welcome to Cybrsoft Browser</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  /* tokens mirror theme/cybrsoft/tokens.css */
  :root{--cb-primary:#3B6FE0;--cb-deep:#1B3A8C;--cb-bright:#6D9BFF;--cb-secondary:#E4ECFF;
    --cb-bg:#F3F6FF;--cb-surface:#FFFFFF;--cb-surface2:#EAF0FF;--cb-border:#D5DFF5;
    --cb-text:#4A5878;--cb-strong:#22336B;--cb-muted:#A5B4D8;--cb-on:#FFF;
    --cb-grad:linear-gradient(135deg,#3B6FE0,#1B3A8C);
    --f-ui:"Inter",system-ui,sans-serif;--f-h:"Bricolage Grotesque","Inter",sans-serif;--r:12px}
  :root[data-theme="dark"]{--cb-primary:#6D9BFF;--cb-deep:#3B6FE0;--cb-secondary:#22336B;
    --cb-bg:#0A1330;--cb-surface:#101C42;--cb-surface2:#0F275E;--cb-border:#22336B;
    --cb-text:#C7D6FF;--cb-strong:#EAF0FF;--cb-muted:#A5B4D8;--cb-on:#0A1330;
    --cb-grad:linear-gradient(135deg,#3B6FE0,#0F1D4A)}
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;background:var(--cb-bg);color:var(--cb-text);font-family:var(--f-ui);
    display:grid;place-items:center;padding:24px 16px;transition:background .2s,color .2s}
  .card{width:100%;max-width:640px;background:var(--cb-surface);border:1px solid var(--cb-border);
    border-radius:20px;box-shadow:0 18px 60px rgba(16,28,66,.16);overflow:hidden}
  .hero{background:var(--cb-grad);color:#fff;padding:22px 26px;display:flex;align-items:center;gap:14px}
  .mark{width:40px;height:40px;border-radius:11px;background:rgba(255,255,255,.18);display:grid;place-items:center;
    font-family:var(--f-h);font-weight:700;font-size:22px}
  .hero h1{font-family:var(--f-h);font-weight:700;margin:0;font-size:20px}
  .hero p{margin:2px 0 0;font-size:13px;opacity:.9}
  .steps{display:flex;gap:6px;padding:16px 26px 0}
  .dot{height:4px;flex:1;border-radius:2px;background:var(--cb-border)}
  .dot.on{background:var(--cb-primary)}
  .body{padding:20px 26px 8px;min-height:230px}
  h2{font-family:var(--f-h);color:var(--cb-strong);font-size:19px;margin:0 0 4px}
  .lead{font-size:13px;color:var(--cb-muted);margin:0 0 16px}
  .opt{display:flex;align-items:flex-start;gap:12px;border:1px solid var(--cb-border);border-radius:var(--r);
    padding:12px 14px;margin-bottom:9px;cursor:pointer;background:var(--cb-surface);transition:.12s}
  .opt:hover{border-color:var(--cb-bright);background:var(--cb-surface2)}
  .opt.sel{border-color:var(--cb-primary);background:var(--cb-surface2);box-shadow:inset 0 0 0 1px var(--cb-primary)}
  .opt .t{font-weight:600;color:var(--cb-strong);font-size:14px}
  .opt .d{font-size:12px;color:var(--cb-muted);margin-top:2px}
  .opt .tag{margin-left:auto;font-size:11px;color:var(--cb-primary);font-weight:600;white-space:nowrap}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:9px}
  .foot{display:flex;align-items:center;gap:10px;padding:16px 26px 22px}
  .spacer{flex:1}
  button{font:inherit;font-weight:600;border-radius:10px;padding:10px 18px;cursor:pointer;border:1px solid var(--cb-border);
    background:var(--cb-surface);color:var(--cb-text)}
  button.primary{background:var(--cb-grad);color:#fff;border:0}
  button:disabled{opacity:.5;cursor:not-allowed}
  .ghost{background:transparent;border:0;color:var(--cb-muted)}
  input[type=text],input[type=url]{width:100%;font:inherit;padding:9px 11px;border-radius:10px;
    border:1px solid var(--cb-border);background:var(--cb-bg);color:var(--cb-strong);margin-top:6px}
  .sumrow{display:flex;justify-content:space-between;font-size:13px;padding:7px 0;border-bottom:1px dashed var(--cb-border)}
  .sumrow b{color:var(--cb-strong)}
  .note{font-size:11px;color:var(--cb-muted);text-align:center;padding:0 26px 16px}
</style>
</head>
<body>
<div class="card">
  <div class="hero"><div class="mark">C</div>
    <div><h1>Welcome to Cybrsoft Browser</h1><p>Private by default. No account. No tracking.</p></div>
  </div>
  <div class="steps" id="dots"></div>
  <div class="body" id="body"></div>
  <div class="foot">
    <button class="ghost" id="back" onclick="go(-1)">Back</button>
    <div class="spacer"></div>
    <button class="primary" id="next" onclick="go(1)">Continue</button>
  </div>
  <div class="note">You can change any of these later in Settings. Nothing here is sent to Cybrsoft.</div>
</div>
<script>
const ENGINES=[
  {id:"duckduckgo",name:"DuckDuckGo",privacy:"No profiling; no personal search history."},
  {id:"brave",name:"Brave Search",privacy:"Independent index; privacy-focused."},
  {id:"startpage",name:"Startpage",privacy:"Google results without tracking you."},
  {id:"google",name:"Google",privacy:"Largest index; collects search data."},
  {id:"bing",name:"Bing",privacy:"Microsoft index; collects search data."},
  {id:"custom",name:"Custom engine…",privacy:"Add your own search URL."}
];
const state={step:0,engine:null,customUrl:"",profile:"strict",theme:"system",tabs:"horizontal"};
const STEPS=[stepSearch,stepPrivacy,stepLook,stepDone];

function dots(){const d=document.getElementById('dots');d.innerHTML='';
  STEPS.forEach((_,i)=>{const s=document.createElement('div');s.className='dot'+(i<=state.step?' on':'');d.appendChild(s);});}
function opt(sel,title,desc,tag){return `<div class="opt${sel?' sel':''}" ${''}>
  <div><div class="t">${title}</div>${desc?`<div class="d">${desc}</div>`:''}</div>${tag?`<span class="tag">${tag}</span>`:''}</div>`;}

function stepSearch(){
  return `<h2>Choose your search engine</h2>
  <p class="lead">Cybrsoft doesn't pick one for you. Pick what you trust.</p>
  ${ENGINES.map(e=>`<div class="opt ${state.engine===e.id?'sel':''}" onclick="pickEngine('${e.id}')">
     <div><div class="t">${e.name}</div><div class="d">${e.privacy}</div></div>
     ${state.engine===e.id?'<span class="tag">Selected</span>':''}</div>`).join('')}
  ${state.engine==='custom'?`<input type="url" id="cu" placeholder="https://example.com/search?q=%s"
     value="${state.customUrl}" oninput="state.customUrl=this.value;refresh()">`:''}`;
}
function stepPrivacy(){
  const P=[["strict","Strict","Maximum protection. Recommended. Some sites may need a quick exception.","Default"],
           ["balanced","Balanced","Strong protection, better site compatibility.",""],
           ["custom","Custom","Control each protection yourself.",""]];
  return `<h2>Privacy level</h2><p class="lead">You can fine-tune everything later.</p>
  ${P.map(([id,t,d,tag])=>`<div class="opt ${state.profile===id?'sel':''}" onclick="state.profile='${id}';refresh()">
    <div><div class="t">${t}</div><div class="d">${d}</div></div>${state.profile===id?'<span class="tag">Selected</span>':tag?`<span class="tag">${tag}</span>`:''}</div>`).join('')}`;
}
function stepLook(){
  const TH=[["system","Match Windows"],["light","Light"],["dark","Dark"]];
  const TB=[["horizontal","Horizontal tabs"],["vertical","Vertical tabs"]];
  return `<h2>Appearance</h2><p class="lead">Theme and tab layout.</p>
  <div class="grid2" style="margin-bottom:12px">${TH.map(([id,t])=>`<div class="opt ${state.theme===id?'sel':''}" onclick="setTheme('${id}')"><div class="t">${t}</div></div>`).join('')}</div>
  <div class="grid2">${TB.map(([id,t])=>`<div class="opt ${state.tabs===id?'sel':''}" onclick="state.tabs='${id}';refresh()"><div class="t">${t}</div></div>`).join('')}</div>`;
}
function stepDone(){
  const eng=ENGINES.find(e=>e.id===state.engine);
  return `<h2>You're all set</h2><p class="lead">Your choices — change them anytime in Settings.</p>
  <div class="sumrow"><span>Search engine</span><b>${eng?eng.name:'—'}</b></div>
  <div class="sumrow"><span>Privacy level</span><b>${state.profile[0].toUpperCase()+state.profile.slice(1)}</b></div>
  <div class="sumrow"><span>Theme</span><b>${state.theme==='system'?'Match Windows':state.theme[0].toUpperCase()+state.theme.slice(1)}</b></div>
  <div class="sumrow"><span>Tabs</span><b>${state.tabs==='vertical'?'Vertical':'Horizontal'}</b></div>`;
}
function pickEngine(id){state.engine=id;refresh();}
function setTheme(id){state.theme=id;document.documentElement.setAttribute('data-theme',id==='system'?'light':id);refresh();}
function canNext(){ if(state.step===0){ if(!state.engine) return false; if(state.engine==='custom'&&!state.customUrl.trim()) return false;} return true;}
function refresh(){
  dots();
  document.getElementById('body').innerHTML=STEPS[state.step]();
  document.getElementById('back').style.visibility=state.step===0?'hidden':'visible';
  const n=document.getElementById('next');
  n.textContent=state.step===STEPS.length-1?'Start browsing':'Continue';
  n.disabled=!canNext();
}
function go(dir){
  if(dir>0&&!canNext())return;
  if(dir>0&&state.step===STEPS.length-1){ /* real browser: apply state + close wizard */
    alert('Setup complete.\n(In the browser this applies your choices and opens the new-tab page.)');return;}
  state.step=Math.min(STEPS.length-1,Math.max(0,state.step+dir));refresh();
}
refresh();
</script>
</body>
</html>
